<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>动捕世界系 · 设备与视觉手对照</title><style>body{margin:0;background:#101822;color:#edf5ff;font:15px system-ui}header{padding:18px 24px}h2{margin:0 0 8px}small{color:#eac77b}#view{height:72vh;position:relative}canvas{display:block}footer{padding:16px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}button{background:#33556f;color:white;border:0;border-radius:6px;padding:9px 20px}input[type=range]{flex:1;min-width:180px}#info{position:absolute;left:24px;top:12px;white-space:pre-line;pointer-events:none;font-size:13px;max-width:95%}label{white-space:nowrap}</style><script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script><header><h2>动捕世界坐标系 · Z-up 设备与手部统一对比</h2><div>会话 __SESSION_ID__ · <span style="color:#6dc9ff">蓝色：动捕虚影</span> · <span style="color:#78edbb">绿色：视觉实体</span> · <span style="color:#ffbd65">橙色虚影：动捕 EGO</span> · <span style="color:#f18cff">紫色实体：SLAM EGO</span></div><small id="warning">正在加载本次计算结果…</small></header><div id="view"><div id="info"></div></div><footer><span>统一对比：mocap 虚影 / EGO 算法实体</span><label><input type="checkbox" id="slam" checked>SLAM 刚体/轨迹</label><button id="play">播放</button><button id="fit">适配视角</button><button id="deviceFit">聚焦设备</button><label><input type="checkbox" id="sensorFrames" checked>IMU / 相机 / 刚体坐标轴</label><label><input type="checkbox" id="m" checked>动捕虚影</label><label><input type="checkbox" id="v" checked>视觉实体</label><label><input type="checkbox" id="head" checked>EGO 刚体</label><label><input type="checkbox" id="device" checked>完整 URDF 设备</label><span id="deviceStatus"></span><label>虚影透明度 <input id="alpha" type="range" min=".05" max=".8" step=".05" value=".25" style="width:100px;min-width:0"></label><input id="time" aria-label="时间轴" type="range" min="0" value="0" step="1"><span id="clock"></span></footer><script type="module">
import * as THREE from 'three';import {installDevice} from './device.js';import {installSensorFrames} from './sensor_frames.js';import {OrbitControls} from './OrbitControls.js';
const $=id=>document.getElementById(id);
async function json(name){const r=await fetch(name);if(!r.ok)throw new Error(`${name}: HTTP ${r.status}`);return r.json()}
async function binary(name){const r=await fetch(name);if(!r.ok)throw new Error(`${name}: HTTP ${r.status}`);return r.arrayBuffer()}
window.addEventListener('unhandledrejection',e=>{$('warning').textContent=`加载失败：${e.reason?.message||e.reason}，请重新导出并检查缓存。`});
const [meta,slamMeta,slamBodyMeta]=await Promise.all(['meta.json','initialization.json','slam_ego_body.json'].map(json));
const faces=new Uint32Array(await binary('faces.bin')),visionFaces=new Uint32Array(await binary('vision_faces.bin'));
const sb=await Promise.all(['initial_body.bin','initial_vision.bin','slam_mocap.bin','slam_ego_pose.bin','slam_ego_markers.bin'].map(async n=>new Float32Array(await binary(n))));
let vv=sb[1],mm=sb[2],headPoses=sb[3],headMarkers=sb[4],bodyMeta=slamBodyMeta;
meta.valid=slamMeta.vision_valid;meta.offset_s=slamMeta.offset_s;
const markerCount=bodyMeta.marker_names.length,markerStride=markerCount*3;
let frame=Math.max(0,meta.valid.findIndex(Boolean)),playing=false,last=0,acc=0;

const scene=new THREE.Scene();scene.background=new THREE.Color('#101822');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('view').append(renderer.domElement);const camera=new THREE.PerspectiveCamera(45,1,.001,100);camera.up.set(0,0,1);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const ambient=new THREE.HemisphereLight(0xffffff,0x344050,2);ambient.position.set(0,0,1);scene.add(ambient);const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(1,-2,3);scene.add(light);
function mesh(color,opacity,topology=faces){const g=new THREE.BufferGeometry();g.setIndex(new THREE.BufferAttribute(topology,1));g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(meta.vertices*3),3));const mat=new THREE.MeshStandardMaterial({color,roughness:.6,metalness:0,side:THREE.DoubleSide,transparent:opacity<1,opacity,depthWrite:opacity===1});const o=new THREE.Mesh(g,mat);o.frustumCulled=false;scene.add(o);return o}const ghost=mesh(0x62baff,.25),solid=mesh(0x56dca5,1,visionFaces);ghost.renderOrder=2;
const headPoseGroup=new THREE.Group();headPoseGroup.matrixAutoUpdate=false;headPoseGroup.add(new THREE.AxesHelper(.08));headPoseGroup.add(new THREE.Mesh(new THREE.SphereGeometry(.004,16,12),new THREE.MeshStandardMaterial({color:0xffbd65})));scene.add(headPoseGroup);headPoseGroup.traverse(o=>{if(o.material){o.material.transparent=true;o.material.opacity=.3;o.material.depthWrite=false}});
const headCloud=new THREE.Group();scene.add(headCloud);const headDots=Array.from({length:markerCount},()=>{const dot=new THREE.Mesh(new THREE.SphereGeometry(.003,12,8),new THREE.MeshStandardMaterial({color:0xffbd65}));dot.material.transparent=true;dot.material.opacity=.3;dot.material.depthWrite=false;headCloud.add(dot);return dot});
const headLineGeometry=new THREE.BufferGeometry();headLineGeometry.setAttribute('position',new THREE.BufferAttribute(new Float32Array(markerCount*(markerCount-1)*3),3));const headLines=new THREE.LineSegments(headLineGeometry,new THREE.LineBasicMaterial({color:0xffbd65,transparent:true,opacity:.45}));headLines.frustumCulled=false;headCloud.add(headLines);
const labelCanvas=document.createElement('canvas');labelCanvas.width=256;labelCanvas.height=64;const ctx=labelCanvas.getContext('2d');ctx.fillStyle='#ffbd65';ctx.font='bold 36px sans-serif';ctx.textAlign='center';ctx.font='bold 26px sans-serif';ctx.fillText('EGO 动捕',128,46);const headLabel=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(labelCanvas),depthTest:false}));headLabel.scale.set(.09,.0225,1);headLabel.position.set(0,0,.105);headPoseGroup.add(headLabel);
function updateHead(){const visible=$('head').checked&&bodyMeta.valid[frame];headPoseGroup.visible=headCloud.visible=visible;if(!visible)return;headPoseGroup.matrix.set(...headPoses.subarray(frame*16,(frame+1)*16));headPoseGroup.matrixWorldNeedsUpdate=true;const points=headMarkers.subarray(frame*markerStride,(frame+1)*markerStride);headDots.forEach((dot,i)=>{dot.visible=Number.isFinite(points[i*3]);if(dot.visible)dot.position.fromArray(points,i*3)});const lines=headLineGeometry.attributes.position.array;let k=0;for(let a=0;a<markerCount;a++)for(let b=a+1;b<markerCount;b++){if(Number.isFinite(points[a*3])&&Number.isFinite(points[b*3])){lines.set(points.subarray(a*3,a*3+3),k);k+=3;lines.set(points.subarray(b*3,b*3+3),k);k+=3}}headLineGeometry.setDrawRange(0,k/3);headLineGeometry.attributes.position.needsUpdate=true;}
const slamGroup=new THREE.Group();slamGroup.matrixAutoUpdate=false;slamGroup.add(new THREE.AxesHelper(.08));slamGroup.add(new THREE.Mesh(new THREE.SphereGeometry(.006,16,12),new THREE.MeshStandardMaterial({color:0xee79ff})));scene.add(slamGroup);
const trajectoryGeometry=new THREE.BufferGeometry(),trajectoryPoints=[];
for(let i=1;i<meta.frames;i++)if(slamMeta.valid[i-1]&&slamMeta.valid[i])for(const j of [i-1,i])trajectoryPoints.push(sb[0][j*16+3],sb[0][j*16+7],sb[0][j*16+11]);
trajectoryGeometry.setAttribute('position',new THREE.Float32BufferAttribute(trajectoryPoints,3));const trajectory=new THREE.LineSegments(trajectoryGeometry,new THREE.LineBasicMaterial({color:0xee79ff,transparent:true,opacity:.45}));scene.add(trajectory);
function updateSlam(){slamGroup.visible=$('slam').checked&&slamMeta.valid[frame];trajectory.visible=$('slam').checked;if(slamGroup.visible){slamGroup.matrix.set(...sb[0].subarray(frame*16,(frame+1)*16));slamGroup.matrixWorldNeedsUpdate=true;}}
function configureComparison(){vv=sb[1];mm=sb[2];headPoses=sb[3];headMarkers=sb[4];bodyMeta=slamBodyMeta;meta.valid=slamMeta.vision_valid;meta.offset_s=slamMeta.offset_s;
 $('m').checked=$('v').checked=$('head').checked=$('slam').checked=true;
 $('warning').textContent=slamMeta.registration_available===false?`SLAM ${slamMeta.algorithm_status.slam_output_poses} 帧均未通过跟踪质量检查：未建立 T_WL，SLAM 设备及视觉手无法在动捕世界系定位。视觉推理已完成，左右手均无有效结果；动捕手部按请求跳过。当前显示有效动捕设备。`:`固定初始化配准：EGO t=${slamMeta.initial_ego_time_s.toFixed(3)}s 对应动捕 t=${slamMeta.initial_mocap_time_s.toFixed(3)}s；之后设备和手仅跟随SLAM。安装外参与时间锚点为候选，非独立精度评估。${slamMeta.mocap_hand_available===false?"本次无动捕手部参考。":""}有效帧：SLAM ${slamMeta.coverage.slam_valid_frames}/${slamMeta.coverage.rgb_frames}，视觉手 ${slamMeta.coverage.world_hand_valid_frames}/${slamMeta.coverage.rgb_frames}。`;update();}

const deviceDescription=await json('device.json');const deviceModels=await installDevice({scene,description:deviceDescription,binary});$('deviceStatus').textContent=deviceDescription.available?'设备安装：已关联参考刚体系':'设备安装待关联：历史刚体模板不同，URDF未放置';$('device').onchange=update;
const sensorCalibration=await (await fetch('sensor_frames.json')).json();const sensorFrames=installSensorFrames({scene,camera,controls,bodyPoses:sb[0],registration:slamMeta,calibration:sensorCalibration,isVisible:()=>$('sensorFrames').checked});$('deviceFit').onclick=()=>{if(slamMeta.registration_available===false){fit();return}$('info').style.display='none';sensorFrames.focus()};$('sensorFrames').onchange=update;
const axis=new THREE.AxesHelper(.08);axis.position.set(0,0,0);scene.add(axis);const grid=new THREE.GridHelper(1,20,0x435b6c,0x263745);grid.rotation.x=Math.PI/2;grid.position.set(0,0,0);scene.add(grid);
function fit(){const box=new THREE.Box3();const pt=new THREE.Vector3();for(const a of [...(bodyMeta.hand_valid[frame]?[mm]:[]),...(meta.valid[frame]?[vv]:[])])for(let k=frame*meta.vertices*3;k<(frame+1)*meta.vertices*3;k+=3)box.expandByPoint(pt.set(a[k],a[k+1],a[k+2]));if($('head').checked&&bodyMeta.valid[frame]){for(let k=frame*markerStride;k<(frame+1)*markerStride;k+=3)if(Number.isFinite(headMarkers[k]))box.expandByPoint(pt.set(headMarkers[k],headMarkers[k+1],headMarkers[k+2]));const t=frame*16;box.expandByPoint(pt.set(headPoses[t+3],headPoses[t+7],headPoses[t+11]));}if($('slam').checked&&slamMeta.valid[frame]){const t=frame*16;box.expandByPoint(pt.set(sb[0][t+3],sb[0][t+7],sb[0][t+11]));}box.getCenter(controls.target);if(box.isEmpty()){controls.target.set(0,0,0)}const size=box.getSize(new THREE.Vector3()).length();camera.position.copy(controls.target).add(new THREE.Vector3(.6,-1,.6).normalize().multiplyScalar(Math.max(.3,size*1.8)));controls.update()}fit();$('fit').onclick=()=>{$('info').style.display='block';fit()};
function update(){deviceModels.update(Array.from(headPoses.subarray(frame*16,(frame+1)*16)),Array.from(sb[0].subarray(frame*16,(frame+1)*16)),$('device').checked&&$('head').checked&&$('m').checked&&bodyMeta.valid[frame],$('device').checked&&$('slam').checked&&slamMeta.valid[frame],+$('alpha').value);updateHead();updateSlam();sensorFrames.update(frame);headLabel.visible=!$('sensorFrames').checked;headPoseGroup.children[0].scale.setScalar($('sensorFrames').checked?.5:1);if($('sensorFrames').checked)slamGroup.visible=false;for(const [o,a] of [[ghost,mm],[solid,vv]]){o.geometry.attributes.position.array.set(a.subarray(frame*meta.vertices*3,(frame+1)*meta.vertices*3));o.geometry.attributes.position.needsUpdate=true;o.geometry.computeVertexNormals()}ghost.visible=$('m').checked&&bodyMeta.hand_valid[frame];solid.visible=$('v').checked&&meta.valid[frame];$('time').value=frame;$('clock').textContent=`${meta.times[frame].toFixed(3)} / ${meta.times.at(-1).toFixed(3)} 秒`;$('info').textContent=`世界系：mocap_world · Z-up · XY 地面 · 单位：米\n定位来源：${slamMeta.registration_available===false?'SLAM 未配准（跟踪无效）':'SLAM '+slamMeta.slam_pose_frame+' · 固定初始化配准'}\nRGB 帧 ${frame} · 动捕候选时刻 ${(meta.times[frame]+meta.offset_s).toFixed(3)} s\n${meta.valid[frame]?'视觉实体有效':'视觉推理已保留：该帧无有效手部结果'}\n${slamMeta.mocap_hand_available===false?'动捕手部：按请求跳过（无标记）':''}\nEGO：${bodyMeta.valid[frame]?markerCount+' 点模板 · 可见点残差 '+bodyMeta.fit_rms_mm[frame].toFixed(2)+' mm':'位姿无效，已隐藏'}\n世界 Z 向上；局部轴：X 红 / Y 绿 / Z 蓝\n${sensorFrames.description}\n四组安装坐标轴基于 SLAM；橙色 EGO 为动捕参照\n左键旋转 · 滚轮缩放 · 右键平移`;}
$('slam').onchange=update;configureComparison();fit();$('time').max=meta.frames-1;$('time').oninput=()=>{frame=+$('time').value;update()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('alpha').oninput=()=>{ghost.material.opacity=+$('alpha').value;update()};$('m').onchange=$('v').onchange=$('head').onchange=update;update();new ResizeObserver(()=>{renderer.setSize($('view').clientWidth,$('view').clientHeight);camera.aspect=$('view').clientWidth/$('view').clientHeight;camera.updateProjectionMatrix()}).observe($('view'));
renderer.setAnimationLoop(t=>{const dt=last?(t-last)/1000:0;last=t;if(playing){acc+=dt;if(acc>=1/30){frame=(frame+Math.floor(acc*30))%meta.frames;acc%=1/30;update()}}controls.update();renderer.render(scene,camera)});
</script></html>
